name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Verify TypeScript & Build PWA Bundle
        run: npm run build

      - name: Assert PWA Service Worker & Manifest Artifacts
        run: |
          test -f dist/sw.js || { echo "Missing dist/sw.js"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "Missing dist/manifest.webmanifest"; exit 1; }
          test -f dist/pwa-192x192.png || { echo "Missing dist/pwa-192x192.png"; exit 1; }
          test -f dist/pwa-512x512.png || { echo "Missing dist/pwa-512x512.png"; exit 1; }
          echo "✅ All CI quality checks, unit tests, and PWA assets verified successfully."
