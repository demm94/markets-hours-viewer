<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" gradientUnits="userSpaceOnUse" x1="256" y1="0" x2="256" y2="512">
      <stop offset="0%" stop-color="#101728" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>

    <radialGradient id="ambientGlow" gradientUnits="userSpaceOnUse" cx="372" cy="142" r="245">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16" />
      <stop offset="48%" stop-color="#38bdf8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#04060b" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="rimGrad" gradientUnits="userSpaceOnUse" x1="256" y1="0" x2="256" y2="512">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="activeArcGrad" gradientUnits="userSpaceOnUse" x1="300" y1="79" x2="431" y2="306">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="quietArcGrad" gradientUnits="userSpaceOnUse" x1="80" y1="209" x2="152" y2="405">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.34" />
    </linearGradient>

    <radialGradient id="beaconGlow" gradientUnits="userSpaceOnUse" cx="430.95" cy="306.17" r="28">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="platinumGrad" gradientUnits="userSpaceOnUse" x1="256" y1="178" x2="256" y2="338">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="52%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Obsidian Squircle Base -->
  <rect id="squircle-bg" width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect id="squircle-ambient" width="512" height="512" rx="116" fill="url(#ambientGlow)" />
  <rect id="squircle-rim" x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="url(#rimGrad)" stroke-width="3" />

  <!-- Minimalist 24h Chronograph Dial & Platinum Monogram -->
  <g id="logo-artwork">
    <!-- Fine Orbital Ring -->
    <circle cx="256" cy="256" r="182" fill="none" stroke="rgba(226, 232, 240, 0.14)" stroke-width="7" />

    <!-- Zenith & Nadir Horological Ticks (12 & 6) -->
    <line x1="256" y1="64" x2="256" y2="84" stroke="#cbd5e1" stroke-opacity="0.55" stroke-width="4.5" stroke-linecap="round" />
    <line x1="256" y1="428" x2="256" y2="448" stroke="#94a3b8" stroke-opacity="0.30" stroke-width="4.5" stroke-linecap="round" />

    <!-- Secondary Quiet Session Arc (125deg to 195deg) -->
    <path
      d="M 151.61 405.09 A 182 182 0 0 1 80.20 208.89"
      fill="none"
      stroke="url(#quietArcGrad)"
      stroke-width="9"
      stroke-linecap="round"
    />

    <!-- Active Trading Session Arc (-76deg to +16deg) -->
    <path
      d="M 300.03 79.41 A 182 182 0 0 1 430.95 306.17"
      fill="none"
      stroke="url(#activeArcGrad)"
      stroke-width="14"
      stroke-linecap="round"
    />

    <!-- Live Market Beacon -->
    <circle cx="430.95" cy="306.17" r="28" fill="url(#beaconGlow)" />
    <circle cx="430.95" cy="306.17" r="11" fill="#34d399" />
    <circle cx="430.95" cy="306.17" r="4.5" fill="#ecfdf5" />

    <!-- Sculpted Platinum Monogram (M) -->
    <path
      d="M 168 320 L 168 196 L 256 274 L 344 196 L 344 320"
      fill="none"
      stroke="url(#platinumGrad)"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
